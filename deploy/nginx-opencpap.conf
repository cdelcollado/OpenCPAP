# nginx site for OpenCPAP (static files only, no backend).
# Installed as /etc/nginx/sites-available/opencpap by deploy/provision.sh.
# The web root must match REMOTE_DIR in deploy/deploy.sh.

server {
    listen 80 default_server;
    server_name _;

    root /var/www/opencpap;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # The PWA manifest needs its own MIME type. Scoped to this location on
    # purpose: a server-wide `types {}` block would replace nginx's defaults
    # (text/html, etc.) and break every other file.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # The service worker must always be revalidated so that new app versions
    # are picked up after a deploy.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Hash-based routing (#/night/...) is handled by the browser; the fallback
    # keeps any direct path working as the app's index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
